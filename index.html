<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b1d16">
  <meta name="description" content="Push In Boots: the cowboy cat who doesn't shoot goblins, he pushes them. A free water-blasting platformer that plays instantly in your browser.">
  <meta property="og:title" content="Push In Boots">
  <meta property="og:description" content="A tiny cowboy cat, a very big water blaster, and a farm full of goblins to push off it.">
  <meta property="og:image" content="assets/ui/keyart.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Push In Boots</title>
  <link rel="icon" type="image/png" href="assets/ui/favicon.png">
  <link rel="apple-touch-icon" href="assets/ui/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/font/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" tabindex="-1" aria-label="Push In Boots"></canvas>
  <button id="pause-btn" class="round" hidden aria-label="Pause"><img src="assets/ui/icon_pause.webp" alt=""></button>
  <div id="ui"></div>
  <div id="boot">
    <img id="boot-logo" src="assets/ui/logo.webp" alt="Push In Boots" width="512" height="210">
    <div id="boot-tag"></div>
    <div id="boot-bar"><div id="boot-fill"></div></div>
    <div id="boot-note">Loading…</div>
  </div>
  <div id="toast" hidden></div>
  <noscript><p style="color:#fff;padding:2em;font-family:sans-serif">Push In Boots needs JavaScript to run.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
