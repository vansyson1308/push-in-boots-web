<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2b1d16">
    <meta name="description" content="Push In Boots - a tiny cowboy cat, a big water blaster and a farm to save.">
    <title>Push In Boots</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b1d16; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #2b1d16; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #2b1d16 url("TemplateData/keyart.jpg") center / cover no-repeat; font-family: system-ui, sans-serif; color: #f8eed7; }
      #loading::before { content: ""; position: absolute; inset: 0; background: rgba(43, 29, 22, 0.45); }
      #loading > * { position: relative; }
      #logo { width: min(56vw, 560px); max-height: 46vh; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,.45)); }
      #bar { width: min(60vw, 520px); height: 22px; margin-top: 4vh; border-radius: 12px; background: rgba(0,0,0,.45);
        border: 3px solid #f8eed7; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(#ffd866, #ffb52e); transition: width .15s; }
      #note { margin-top: 1.6vh; font-size: clamp(14px, 2.2vh, 20px); text-shadow: 0 2px 4px rgba(0,0,0,.6); }
      #error { display: none; position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); max-width: 80vw;
        padding: 12px 18px; border-radius: 10px; background: #b3261e; color: #fff; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <img id="logo" src="TemplateData/logo.png" alt="Push In Boots">
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Loading&hellip;</div>
    </div>
    <div id="error"></div>
    <script>
      // Load and frame-rate probes for docs/pivot/release/WEB_REPORT.md (read them from the console).
      window.bootsTimes = { navStart: 0, instanceMs: 0, readyMs: 0 };
      window.bootsGameReady = function () {
        if (!window.bootsTimes.readyMs) window.bootsTimes.readyMs = Math.round(performance.now());
        document.querySelector("#loading").style.display = "none";
      };
      (function fpsProbe() {
        var frames = 0, last = performance.now();
        window.bootsFps = 0;
        function tick(now) {
          frames++;
          if (now - last >= 1000) { window.bootsFps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) ||
        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

      // The game is landscape 16:9 to 19.5:9: a wider or squarer window or tablet gets bars; a phone held upright
      // fills the screen (the game shows its own "turn your phone" card there).
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w > h) {
          var aspect = w / h;
          if (aspect < 16 / 9) h = Math.floor(w * 9 / 16);
          else if (aspect > 19.5 / 9) w = Math.floor(h * 19.5 / 9);
        }
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      function showError(msg) {
        var e = document.querySelector("#error");
        e.textContent = msg;
        e.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Obsidian Lantern",
        productName: "Push In Boots",
        productVersion: "0.3.0",
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); },
      };
      // Phones: render at most 2x the CSS size (3x screens cost a lot of fill rate for no visible gain).
      if (mobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = Math.round(100 * progress) + "%";
          if (progress >= 0.9) document.querySelector("#note").textContent = "Almost there…";
        }).then(function (instance) {
          window.unityInstance = instance;
          window.bootsTimes.instanceMs = Math.round(performance.now());
        }).catch(function (message) {
          showError(message);
        });
      };
      script.onerror = function () { showError("The game files could not be loaded. Please reload the page."); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
